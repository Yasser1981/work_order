# بناء الملف التنفيذي لويندوز تلقائياً على خوادم GitHub (ق-٥٢).
#
# الغرض: أن يُنزَّل البرنامج جاهزاً بلا تنصيب بايثون ولا أدوات على حاسبة
# المستخدم. تعمل عند كل دفع، وعند الطلب اليدوي من تبويب Actions.
#
# المخرَج: أرشيف باسم «أوامر_العمل-ويندوز» يُنزَّل من صفحة التشغيل.

name: بناء ويندوز

on:
  push:
    branches: ["**"]
  workflow_dispatch:      # زرّ «Run workflow» في تبويب Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 openpyxl pytest pyinstaller

      # الاختبارات أولاً — لا يُبنى ملف تنفيذي من شيفرة ساقطة.
      # QT_QPA_PLATFORM=offscreen ليعمل Qt بلا شاشة على الخادم.
      - name: تشغيل الاختبارات
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: البناء
        run: python -m PyInstaller --noconfirm "أوامر_العمل.spec"

      # تحقّق أن المخرَج وُجد فعلاً — لا نكتفي بعدم فشل الأمر
      - name: التحقّق من المخرَج
        shell: pwsh
        run: |
          $exe = "dist/أوامر_العمل.exe"
          if (-not (Test-Path $exe)) { throw "لم يُنتَج الملف التنفيذي" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB)
          Write-Host "تمّ: $exe  ($mb ميغابايت)"

      - name: رفع الملف للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: أوامر_العمل-ويندوز
          path: dist/أوامر_العمل.exe
          retention-days: 90
